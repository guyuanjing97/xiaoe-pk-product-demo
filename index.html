<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:"><title>小鹅通企学院 PK赛联动 Demo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#1d2939;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}header{height:72px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;padding:0 28px;gap:22px}h1{font-size:21px;margin:0}header p{color:#667085;margin:0;font-size:14px}.status{margin-left:auto;display:flex;align-items:center;gap:8px;color:#067647;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#12b76a}.tabs{height:54px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:end;padding:0 28px;gap:28px}.tabs button{height:54px;border:0;background:none;font-size:15px;color:#667085;cursor:pointer;border-bottom:3px solid transparent}.tabs button.active{color:#1769ff;border-color:#1769ff;font-weight:650}.actions{margin-left:auto;display:flex;gap:8px;align-self:center}.actions a{padding:8px 13px;border:1px solid #d0d5dd;border-radius:6px;background:#fff;color:#344054;text-decoration:none;font-size:13px}.stage{height:calc(100vh - 126px);padding:14px;display:grid;gap:14px}.stage.dual{grid-template-columns:minmax(720px,1fr) 430px}.stage.single{grid-template-columns:1fr}.frame{background:#fff;border:1px solid #dfe3e8;border-radius:8px;overflow:hidden;position:relative;box-shadow:0 2px 8px rgba(16,24,40,.05)}iframe{width:100%;height:100%;border:0}.label{position:absolute;z-index:3;left:12px;top:10px;background:rgba(16,24,40,.88);color:#fff;padding:5px 9px;border-radius:4px;font-size:12px;pointer-events:none}.mobile-frame{background:#d8dde5;padding:12px}.mobile-frame iframe{background:#fff;border-radius:10px}@media(max-width:1000px){.stage.dual{grid-template-columns:1fr}.stage.dual .frame:first-child{display:none}.stage{height:calc(100vh - 126px);padding:8px}.mobile-frame{padding:0}header p{display:none}}</style></head>
<body><header><div><h1>小鹅通企学院 · PK赛产品 Demo</h1><p>B端配置保存到当前浏览器，C端同步活动信息、玩法、匹配与计分效果</p></div><div class="status"><span class="dot"></span><span id="syncText">浏览器演示数据已联动</span></div></header>
<div class="tabs"><button class="active" data-mode="dual">联动演示</button><button data-mode="b">B端配置</button><button data-mode="c">C端学员</button><div class="actions"><a href="b.html" target="_blank">独立打开B端</a><a href="c.html?entry=pk" target="_blank">独立打开C端</a></div></div>
<main id="stage" class="stage dual"><div class="frame" id="bFrame"><span class="label">B端 · 企学院管理台</span><iframe src="b.html"></iframe></div><div class="frame mobile-frame" id="cFrame"><span class="label">C端 · 学员H5</span><iframe src="c.html"></iframe></div></main>
<script>const stage=document.querySelector('#stage'),bf=document.querySelector('#bFrame'),cf=document.querySelector('#cFrame'),sync=document.querySelector('#syncText');document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===btn));const m=btn.dataset.mode;stage.className='stage '+(m==='dual'?'dual':'single');bf.style.display=m==='c'?'none':'';cf.style.display=m==='b'?'none':''});window.addEventListener('message',e=>{if(e.data?.type==='PK_CONFIG_UPDATED'){cf.querySelector('iframe').contentWindow.postMessage(e.data,'*');sync.textContent='配置已保存，C端已读取最新演示数据';setTimeout(()=>sync.textContent='浏览器演示数据已联动',2200)}if(e.data?.type==='REQUEST_PK_CONFIG'){bf.querySelector('iframe').contentWindow.postMessage(e.data,'*')}});</script></body></html>
